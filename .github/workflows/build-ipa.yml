name: Build RepliFlix iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SCHEME: RepliFlix
  PROJECT: RepliFlix.xcodeproj
  ARCHIVE_PATH: build/RepliFlix.xcarchive

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Resolve Swift packages
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Archive unsigned app
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO | tee build.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/RepliFlix.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry RepliFlix-unsigned.ipa Payload)
          shasum -a 256 build/RepliFlix-unsigned.ipa | tee build/RepliFlix-unsigned.ipa.sha256

      - name: Upload IPA and archive
        uses: actions/upload-artifact@v4
        with:
          name: RepliFlix-iOS-build
          path: |
            build/RepliFlix-unsigned.ipa
            build/RepliFlix-unsigned.ipa.sha256
            build/RepliFlix.xcarchive
            build.log
          if-no-files-found: error
          retention-days: 14
